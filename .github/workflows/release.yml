name: release

# Triggers on a version tag like v0.2.0. Publishes the Python package to PyPI
# using Trusted Publishing (OIDC — no stored token) and the container image to
# GHCR. Set up Trusted Publishing once at:
#   https://pypi.org/manage/project/mcp-gate/settings/publishing/

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python tests/test_core.py
      - run: python tests/test_samples.py

  pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write          # required to push to GHCR
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
